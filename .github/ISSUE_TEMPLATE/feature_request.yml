name: Feature request
description: Suggest an improvement for OpenReshoot.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should OpenReshoot do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS app
        - Model conversion
        - Cloud Reshoot endpoint
        - Local web prototype
        - Documentation
    validations:
      required: true
