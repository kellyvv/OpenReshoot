name: OpenReshot
options:
  bundleIdPrefix: com.openreshot
  deploymentTarget:
    iOS: "18.0"          # MetalSplatter requires iOS 18+
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter
    from: "1.0.1"

schemes:
  OpenReshot:
    build:
      targets:
        OpenReshot: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  OpenReshot:
    type: application
    platform: iOS
    sources:
      - path: OpenReshot
        excludes:
          - SHARP.mlpackage
          - DemoFLOW.png
          - DemoFLOW.ply
      - path: OpenReshot/DemoFLOW.png
        buildPhase: resources
      - path: OpenReshot/DemoFLOW.ply
        buildPhase: resources
    info:
      path: OpenReshot/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        CFBundleDisplayName: Reshot
        NSPhotoLibraryUsageDescription: "Pick a photo to turn into a 3D parallax view."
        NSPhotoLibraryAddUsageDescription: "Save reconstructed photos, motion videos, GIFs, and Live Photos to your library."
        OpenReshotModelDownloadBaseURL: "https://modelscope.cn/models/kilywei/openreshoot-sharp-coreml/resolve/main/SHARP.mlpackage"
        OpenReshotModelDownloadMirrorBaseURLs:
          - "https://huggingface.co/kellyxiaowei/openreshoot-sharp-coreml/resolve/main/SHARP.mlpackage"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    settings:
      base:
        PRODUCT_NAME: Reshot
        PRODUCT_BUNDLE_IDENTIFIER: com.openreshoot.app
        DEVELOPMENT_TEAM: 2K4BDCCL73
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 1536x1536 activations are heavy — ask iOS for the raised memory cap.
        # (Requires a provisioning profile that allows the entitlement.)
        CODE_SIGN_ENTITLEMENTS: OpenReshot/OpenReshot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
